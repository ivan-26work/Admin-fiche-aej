<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>AEJ • Tableau de bord</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Styles CSS externe -->
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <!-- LOADER INITIAL (centré) -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-card">
      <div class="loading-title">AEJ</div>
      <div class="loading-spinner"></div>
    </div>
  </div>

  <!-- SYNC LOADER (upload progression) -->
  <div class="sync-loader hidden" id="syncLoader">
    <div class="sync-loader-content">
      <i class="fas fa-circle-notch fa-spin"></i>
      <span class="sync-text">CHARGEMENT</span>
      <span class="sync-count">0/0</span>
    </div>
  </div>

  <!-- DELETE LOADER -->
  <div class="delete-loader hidden" id="deleteLoader">
    <div class="delete-loader-backdrop"></div>
    <div class="delete-loader-content">
      <i class="fas fa-circle-notch fa-spin"></i>
      <div class="delete-loader-text">Suppression en cours...</div>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header">
    <a href="index.html" class="logo-circle" aria-label="AEJ">
      <img src="assets/logo.png" alt="Logo AEJ" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ccircle cx=\'50\' cy=\'50\' r=\'45\' fill=\'url(%23g)\'/%3E%3Cdefs%3E%3ClinearGradient id=\'g\' x1=\'0%25\' y1=\'0%25\' x2=\'100%25\' y2=\'100%25\'%3E%3Cstop offset=\'0%25\' stop-color=\'%234a90e2\'/%3E%3Cstop offset=\'100%25\' stop-color=\'%23ff7e9f\'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x=\'50\' y=\'70\' font-size=\'50\' text-anchor=\'middle\' fill=\'white\' font-family=\'Arial\'%3EAEJ%3C/text%3E%3C/svg%3E';">
    </a>

    <span class="site-name-3d">AEJ</span>

    <!-- Barre de recherche (par défaut) -->
    <div class="search-container" id="searchContainer">
      <input type="text" class="search-input" id="searchInput" placeholder="Rechercher (ex: 16167122 F)">
    </div>

    <!-- Barre multi-sélection (remplace recherche) -->
    <div class="multi-select-actions hidden" id="multiSelectActions">
      <span class="select-count" id="selectCount">0 sélectionné</span>
      <div class="select-buttons">
        <button class="action-btn" id="downloadSelectedBtn" title="Télécharger">
          <i class="fas fa-download"></i>
        </button>
        <button class="action-btn" id="deleteSelectedBtn" title="Supprimer">
          <i class="fas fa-trash"></i>
        </button>
        <button class="action-btn" id="cancelSelectBtn" title="Annuler">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <!-- Bouton paramètres -->
    <a href="para.html" class="settings-btn" id="settingsBtn" aria-label="Paramètres">
      <i class="fas fa-cog"></i>
    </a>
  </header>

  <!-- STATS DATES (scrollable) -->
  <div class="stats-scroll-container" id="statsContainer">
    <div class="stats-flex-row" id="statsRow">
      <!-- Les stats dates seront injectées par JS -->
    </div>
  </div>

  <!-- CONTENU PRINCIPAL -->
  <main class="main-content" id="mainContent">
    <!-- Le contenu sera injecté par JS -->
  </main>

  <!-- FOOTER CATÉGORIES (scrollable) -->
  <footer class="categories-footer" id="categoriesFooter">
    <div class="categories-scroll-container">
      <div class="categories-flex-row" id="categoriesRow">
        <!-- Les catégories seront injectées par JS -->
      </div>
    </div>
    <button class="add-category-btn" id="addCategoryBtn" title="Créer une catégorie">
      <i class="fas fa-folder"></i>
    </button>
  </footer>

  <!-- BOUTON FLOTTANT UPLOAD -->
  <div class="fab-rectangle" id="fabContainer">
    <button class="fab fab-upload" id="uploadBtn" title="Uploader des fichiers" disabled>
      <i class="fas fa-plus"></i>
    </button>
  </div>

  <!-- OVERLAY DE CHOIX DE CATÉGORIE -->
  <div class="category-overlay hidden" id="categoryOverlay">
    <div class="overlay-backdrop" id="categoryOverlayBackdrop"></div>
    <div class="overlay-container category-overlay-container">
      <div class="overlay-header category-overlay-header">
        <span class="overlay-title">Choisi une filière</span>
      </div>
      <div class="overlay-content category-overlay-content" id="categoryOverlayContent">
        <!-- Les catégories seront injectées par JS -->
      </div>
    </div>
  </div>

  <!-- OVERLAY DE VISUALISATION -->
  <div class="file-overlay hidden" id="fileOverlay">
    <div class="overlay-backdrop" id="overlayBackdrop"></div>
    <div class="overlay-container">
      <div class="overlay-header">
        <span class="overlay-filename" id="overlayFilename"></span>
      </div>
      <div class="overlay-content" id="overlayContent"></div>
      <div class="overlay-footer">
        <div class="overlay-metadata" id="overlayMetadata"></div>
        <div class="overlay-actions">
          <button class="overlay-action-btn" id="overlayDownload" title="Télécharger">
            <i class="fas fa-download"></i>
          </button>
          <button class="overlay-action-btn" id="overlayDelete" title="Supprimer">
            <i class="fas fa-trash"></i>
          </button>
          <button class="overlay-action-btn" id="overlayFullscreen" title="Ouvrir en plein écran">
            <i class="fas fa-expand"></i>
          </button>
          <button class="overlay-action-btn" id="overlayClose" title="Fermer">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/theme.js"></script>
  <script src="js/index.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
