<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>AEJ • Paramètres</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Style propre à para.html -->
  <link rel="stylesheet" href="css/para.css">
</head>
<body>
  <!-- LOADER INITIAL -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-card">
      <div class="loading-title">AEJ</div>
      <div class="loading-spinner"></div>
    </div>
  </div>

  <!-- HEADER AVEC RETOUR -->
  <header class="header">
    <a href="index.html" class="back-btn" id="backBtn" aria-label="Retour">
      <i class="fas fa-arrow-left"></i>
    </a>
    <span class="page-title">PARAMÈTRES</span>
    <div class="header-placeholder"></div>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main class="main-content">
    <!-- CARTE 1 - PROFIL UTILISATEUR -->
    <div class="param-card" id="profileCard">
      <div class="card-header">
        <i class="fas fa-user-circle"></i>
        <h2>Profil</h2>
      </div>
      
      <div class="card-content">
        <div class="form-group">
          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" class="param-input" placeholder="Votre prénom">
        </div>
        
        <div class="form-group">
          <label for="nom">Nom</label>
          <input type="text" id="nom" class="param-input" placeholder="Votre nom">
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="param-input" readonly disabled>
        </div>
        
        <button class="btn-save" id="saveProfileBtn">
          <i class="fas fa-save"></i> Sauvegarder
        </button>
      </div>
    </div>

    <!-- CARTE 2 - ACCÈS RAPIDE (archive.html supprimé) -->
    <div class="param-card" id="navCard">
      <div class="card-header">
        <i class="fas fa-compass"></i>
        <h2>Accès rapide</h2>
      </div>
      
      <div class="card-content nav-content">
        <a href="vu.html" class="nav-btn" id="gotoVu">
          <i class="fas fa-eye"></i> Vu.html
        </a>
        <!-- Lien archive.html supprimé -->
      </div>
    </div>

    <!-- CARTE MODE NUIT/JOUR SUPPRIMÉE -->

    <!-- BARRE INFÉRIEURE 50px -->
    <div class="footer-bar">
      <a href="contact.html" class="footer-link">
        <i class="fas fa-phone-alt"></i> Contact
      </a>
      <span class="footer-separator">•</span>
      <a href="confidentialite.html" class="footer-link">
        <i class="fas fa-lock"></i> Confidentialité
      </a>
      <span class="footer-separator">•</span>
      <a href="apropos.html" class="footer-link">
        <i class="fas fa-info-circle"></i> À propos
      </a>
      <span class="footer-separator">•</span>
      <a href="https://emploi-jeune.fr" target="_blank" class="footer-link site-link">
        <i class="fas fa-external-link-alt"></i> Site Emploi Jeune
      </a>
    </div>

    <!-- BOUTON DÉCONNEXION -->
    <button class="logout-btn" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i> Déconnexion
    </button>
  </main>

  <!-- Script JavaScript propre à para.html -->
  <script src="js/para.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
